<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salamandra SN Report Generator V68</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#202124;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0;padding:16px}.wrap{max-width:900px;margin:auto}
h1{font-size:23px;margin:4px 0 6px}.hint{color:#606770;font-size:14px;margin:0 0 16px}
.card{background:white;border:1px solid #dfe3e8;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cardhead h2{font-size:17px;margin:0}.grid{display:flex;flex-wrap:wrap;gap:12px}.grid>div{width:calc(50% - 6px)}
label{display:block;font-size:13px;font-weight:650;margin:0 0 5px;color:#424850}
input,select,textarea{width:100%;font:inherit;border:1px solid #cbd1d8;border-radius:9px;padding:11px;background:#fff;color:#202124;min-height:44px}
textarea{min-height:100px;resize:vertical;line-height:1.45}
.full{grid-column:1/-1}.rcPartFields{display:none;margin-top:8px}.rcPartFields.show{display:block}.rcPartFields input{margin-top:7px}.subbin{display:none}.subbin.show{display:block}
button{border:0;border-radius:9px;padding:11px 15px;font:inherit;font-weight:650;cursor:pointer}
.primary{background:#1769d2;color:white}.secondary{background:#e9eef5;color:#253348}.danger{background:#fff0f0;color:#b42318}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
#output{min-height:260px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto}

.stepRow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:7px 0}
.stepNo{font-weight:700;color:#596273;text-align:center;min-width:25px}.moveControls{flex:0 0 34px;width:34px;display:flex;flex-direction:column;gap:3px;align-items:stretch}.moveStep{width:34px;min-width:34px;min-height:27px;padding:2px 3px!important;background:#eef2f7!important;color:#334155!important;border:1px solid #d8dee8!important;border-radius:7px;font-size:14px;line-height:1}.moveStep:disabled{opacity:.3;cursor:not-allowed}.stepRow{border:1px solid transparent;border-radius:11px;padding:4px;transition:background .18s,border-color .18s}.sectionHelp{font-size:12px;color:#64748b;margin:4px 0 10px}quickTip{background:#f1f6ff;border:1px solid #d7e6ff;border-radius:9px;padding:9px 11px;color:#31547d;font-size:12px;margin:8px 0 12px}.stepRow.justMoved{animation:moveFlash .45s ease-out}@keyframes moveFlash{0%{background:#dbeafe;border-color:#1769d2}100%{background:transparent;border-color:transparent}}
.stepRow select.stepSelect{flex:1 1 190px;min-width:0;width:auto}.stepRow input{flex:1 1 100%;min-width:0;width:100%;position:relative;z-index:1;pointer-events:auto}.stepRow select.reTarget{flex:1 1 100%;min-width:0;width:100%}.stepRow.resistanceMode{display:grid;grid-template-columns:22px 32px minmax(0,1fr) minmax(0,1fr) 60px 26px;gap:4px;align-items:center}.stepRow.resistanceMode .stepNo{grid-column:1;grid-row:1}.stepRow.resistanceMode .moveControls{grid-column:2;grid-row:1;flex-direction:column;width:32px}.stepRow.resistanceMode .stepSelect{grid-column:3;grid-row:1;min-width:0;width:100%;font-size:12px;padding:8px 3px}.stepRow.resistanceMode .resistanceName{grid-column:4;grid-row:1;min-width:0;width:100%!important;font-size:12px;padding:8px 3px;flex:none!important}.stepRow.resistanceMode .resistanceToggle{grid-column:5;grid-row:1;min-width:0;width:100%;font-size:12px;padding:8px 3px}.stepRow.resistanceMode .resistanceOhms{grid-column:3/6;grid-row:2;width:100%;font-size:13px;padding:8px 7px;min-height:38px}.stepRow.resistanceMode button:last-child{grid-column:6;grid-row:1;padding:7px 2px}.stepRow input.resistanceName{flex:1 1 120px!important;width:auto!important}
.stepRow.checkMode{display:grid;grid-template-columns:25px 34px minmax(115px,1.1fr) minmax(105px,1fr) 76px 30px;gap:5px;align-items:center}
.stepRow.checkMode .stepNo{grid-column:1;grid-row:1}
.stepRow.checkMode .moveControls{grid-column:2;grid-row:1;flex-direction:column;width:34px}
.stepRow.checkMode .stepSelect{grid-column:3;grid-row:1;min-width:0;width:100%;font-size:13px;padding:8px 4px}
.stepRow.checkMode .checkName{grid-column:4;grid-row:1;display:block!important;min-width:0;width:100%!important;flex:none!important;font-size:13px;padding:8px 5px}
.stepRow.checkMode .checkResult{grid-column:5;grid-row:1;display:block!important;min-width:0;width:100%;font-size:13px;padding:8px 4px}
.stepRow.checkMode button:last-child{grid-column:6;grid-row:1;padding:7px 3px}
@media(max-width:600px){.stepRow.checkMode{grid-template-columns:22px 32px minmax(78px,1fr) minmax(68px,1fr) 60px 26px;gap:4px}.stepRow.checkMode .moveControls{width:32px}.stepRow.checkMode .stepSelect,.stepRow.checkMode .checkName,.stepRow.checkMode .checkResult{font-size:12px;padding:8px 3px}}
@media(max-width:600px){.stepRow.resistanceMode{grid-template-columns:22px 30px minmax(0,1fr) minmax(0,1fr) 56px 24px;gap:3px}.stepRow.resistanceMode .moveControls{width:30px}.stepRow.resistanceMode .stepSelect,.stepRow.resistanceMode .resistanceName,.stepRow.resistanceMode .resistanceToggle{font-size:11px;padding:8px 2px}.stepRow.resistanceMode .resistanceOhms{grid-column:3/6}}
.stepRow button{padding:9px}.resultToggle{background:#dff4e5;color:#176b36;font-size:13px}.resultToggle.fail{background:#ffe3e3;color:#b42318}
.stepRow button{padding:9px;background:#fff0f0;color:#b42318}
.small{font-size:12px;color:#6b7280;margin-top:5px}.errorDetail{user-select:text;-webkit-user-select:text}
@media(max-width:600px){body{padding:10px}.grid>div{width:100%}.card{padding:13px}.stepRow{gap:6px}.stepRow select,.stepRow input{font-size:14px;padding:10px}.stepRow button{padding:8px 10px}}

.snInputRow{display:flex;gap:8px;align-items:stretch}
.snInputRow .sn{min-width:0;flex:1}
.scanQrBtn{flex:0 0 auto;border:0;border-radius:9px;padding:0 14px;background:#2563a6;color:#fff;font-weight:650;font-size:14px;white-space:nowrap}
.scanQrBtn:active{opacity:.8}
.qrModal{position:fixed;inset:0;background:#000b;z-index:9999;display:none;align-items:center;justify-content:center;padding:18px}
.qrPanel{width:min(100%,480px);background:#fff;color:#202124;border-radius:16px;padding:16px}
.qrPanel h3{margin:0 0 8px;font-size:18px}
.qrPanel p{font-size:14px;color:#5f6368;margin:0 0 12px}
.qrVideoWrap{background:#111;border-radius:12px;overflow:hidden;min-height:220px;display:flex;align-items:center;justify-content:center}
.qrVideo{width:100%;max-height:55vh;object-fit:cover;display:block}
.qrActions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.qrActions button{border:0;border-radius:9px;padding:10px 14px;font:inherit}
.qrClose{background:#e8eaed;color:#202124}
.qrStatus{margin-top:10px!important;min-height:20px}
@media(max-width:420px){.scanQrBtn{padding:0 10px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Salamandra SN Report Generator</h1>
<p class="hint">Salamandra 維修紀錄：輸入 SN、Station、Error Code、Status 及 SUB-BIN，再產生可直接貼到聊天群的報告。</p>
<div id="records"></div>
<div class="actions">
<button class="secondary" id="add">＋ 新增一筆</button>
<button class="primary" id="generate">產生報告</button>
<button class="secondary" id="copy">複製全部</button>
<button class="secondary" id="parseOutput">從輸出回填欄位</button>
<button class="danger" id="clear">清空全部</button>
</div>
<div class="card">
<div class="cardhead"><h2>輸出結果</h2><span class="small" id="count"></span></div>
<textarea id="output" placeholder="報告輸出區

• 產生報告：按上方「產生報告」，結果會顯示在這裡。
• 回填欄位：貼上既有報告後按「從輸出回填欄位」，系統會盡量自動選取對應選單；無法辨識的步驟會保留原文。
• 生成一日報告：先將當天所有報告貼到這裡，再按下方「生成一日報告」，系統會整理有 SN 的紀錄、重新編號，並移除 RC 清號代碼。

提示：開始輸入或貼上內容後，這段灰色說明會自動消失。"></textarea>
<div class="actions" style="margin:10px 0 0"><button class="secondary" id="dailyReport" type="button">生成一日報告</button></div>

</div>
</div>

<datalist id="errorOptions"><option value="自訂輸入"></option>
<option value="7 : Run_Authenticator_Win.etf Failed 1 0 1"></option>
<option value="11 : Salamandra_CPLDs_Erase_All.stp Failed 1 0 1"></option>
<option value="initial_setup_jig_control-jig_power_on-ERROR-JIGControllerException"></option>
<option value="power_on-burn_os_if_needed_and_boot_os-ERROR-TimeoutError;">Burn OS Timeout</option>
<option value="194 : SW_U74_Via_U8_U9_Bit1_U12_U13_MUXs_ct.cvf Failed 1 0 1"></option>
<option value="197 : SW_U78_Via_U8_U9_Bit1_U10_U11_MUXs_ct.cvf Failed 1 0 1"></option>
<option value="103 : Pwr_Good_OSFP_CTRL_Sense-all_ct.cvf Failed 1 0 1"></option>
<option value="176 Pwr_Good_AVDD_Sense-all_ct.cvf"></option>
<option value="63: CMEX_U52_BIOS_Flash_program_8MHz.etf Failed 101"></option>
<option value="monitoring_with_load-monitoring_vrs_with_load-FAIL-MEASUREMENT;"></option>
<option value="sbc_storage_usb-passmark-FAIL-MEASUREMENT"></option>
<option value="power_on-config_static_ip-ERROR-Exception;"></option>
</datalist>
<datalist id="netNameOptions"><option value="自訂輸入"></option>
<option value="SW_GP_PL_AVDD_T_PG"></option>
<option value="SW_GP_OSFP_SWB_CONTROLLER1_PG"></option>
<option value="PORTS_GP_OSFP_CONTROLLER_PG"></option>
<option value="NA"></option>
</datalist>
<datalist id="subbinOptions"><option value="自訂輸入"></option>
<option value="NA"></option>
<option value="pdb1_hsc_1_read_hotswap_temperature-Measuring HOTSWAP TEMPERATURE"></option>
</datalist>
<div id="recordTemplate" style="display:none">
<section class="card record">
<div class="cardhead"><h2>資料 <span class="num"></span></h2><button class="danger remove" type="button">刪除此筆</button></div>
<div class="grid">
<div><label>SN</label>
<div class="snInputRow">
<input class="sn" inputmode="numeric" placeholder="輸入 SN">

</div>
</div>
<div><label>Station</label><select class="station"><option>R_JTAG</option><option>R_FT</option><option>B30M</option><option value="__custom">自訂輸入</option></select><input class="stationCustom customField" placeholder="輸入 Station" style="display:none;margin-top:6px"></div>
<div class="full"><label>Error Code</label><div class="small">Station 選 R_JTAG 顯示 JTAG/CVF；選 R_FT 顯示 FT 測試項目。</div>
<select class="errorSelect">
<option value="">請選擇 Error Code</option>
<option value="__custom">自訂輸入</option>
<optgroup label="JTAG / CVF">
<option value="7 : Run_Authenticator_Win.etf Failed 1 0 1">7</option>
<option value="11 : Salamandra_CPLDs_Erase_All.stp Failed 1 0 1">11</option>
<option value="26 : Salamandra_ASIC_MP29816_Program_0x62_Rev0100.etf Failed 1 0 1">26</option>
<option value="63: CMEX_U52_BIOS_Flash_program_8MHz.etf Failed 101">63</option>
<option value="69 : Pwr_Good_12V_PDB0_PDB1_Sense_ct.cvf Failed 1 0 1">69</option>
<option value="91 : Salamandra_AMD_TAP3_infrastructure_inf.cvf Failed 1 0 1">91</option>
<option value="98 : Pwr_Good_1V8_CPLD_Sense-all_ct.cvf Failed 1 0 1">98</option>
<option value="103 : Pwr_Good_OSFP_CTRL_Sense-all_ct.cvf Failed 1 0 1">103</option>
<option value="176 : Salamandra_ASIC_TAP1_infrastructure_inf.cvf Failed 1 0 1">176</option>
<option value="176 Pwr_Good_AVDD_Sense-all_ct.cvf">176</option>
<option value="182 : Salamandra_pu&amp;pd_pull.cvf Failed 1 0 1">182</option>
<option value="194 : SW_U74_Via_U8_U9_Bit1_U12_U13_MUXs_ct.cvf Failed 1 0 1">194</option>
<option value="197 : SW_U78_Via_U8_U9_Bit1_U10_U11_MUXs_ct.cvf Failed 1 0 1">197</option>
</optgroup>
<optgroup label="Leakage Monitoring">
<option value="a2d_leakage_monitoring-monitor_mgmt_leak_AIN0-FAIL-MEASUREMENT;">MGMT Leak AIN0</option>
<option value="__swb_leakage">SWB Leakage (AIN0–3)</option>
</optgroup>
<optgroup label="Chiller">
<option value="chiller init_monitor_chiller until ready-ERROR-TIMEOUT">Chiller Timeout</option>
</optgroup>
<optgroup label="LED">
<option value="led-led-FAIL-MEASUREMENT">LED Fail</option>
</optgroup>
<optgroup label="JIG">
<option value="initial_setup_jig_control-jig_power_on-ERROR-JIGControllerException">JIG Power On</option>
</optgroup>
<optgroup label="Power On">
<option value="power_on-burn_os_if_needed_and_boot_os-ERROR-TimeoutError;">Burn OS Timeout</option>
<option value="power_on-burn_os_if_needed_and_boot_os-ERROR-OutOfBandException;">Burn OS OutOfBand</option>
<option value="power_on-config_static_ip-ERROR-Exception;">Static IP Exception</option>
</optgroup>
<optgroup label="Monitoring">
<option value="__monitoring_load">Monitoring with Load</option>
<option value="monitoring_under_stress-summerize_asic_calculations_asics-FAIL-MEASUREMENT">ASIC Delta Temp</option>
</optgroup>
<optgroup label="Interrupt">
<option value="interrupts-interrupts_phase-FAIL-MEASUREMENT;">Interrupt Fail</option>
</optgroup>
<optgroup label="USB / Storage">
<option value="sbc_storage_usb-passmark-FAIL-MEASUREMENT">USB PassMark Fail</option>
</optgroup>
</select>
<select class="errorLoadType" style="display:none;margin-top:7px"><option value="vrs">VRS</option><option value="osfp">OSFP</option></select>
<select class="errorAin" style="display:none;margin-top:7px"><option value="0">AIN0</option><option value="1">AIN1</option><option value="2">AIN2</option><option value="3">AIN3</option></select>
<input class="errorCustom" placeholder="輸入自訂 Error Code" style="display:none;margin-top:7px">
<div class="errorDetail" aria-live="polite" style="display:none;margin-top:7px;padding:9px 11px;border:1px solid #444;border-radius:8px;font-size:12px;line-height:1.4;overflow-wrap:anywhere;color:#b8c2ce"></div>
</div>
<div class="full">
<label>Status</label>
<div class="quickTip">提示：每一行代表一個維修步驟。先選動作，再填出現的零件或結果欄位；不確定分類時可選「自訂輸入」。</div>
<div class="sectionHelp">先選擇「檢查／測試」，再選擇「維修／處理」；需要調整順序時，使用 ↑ ↓ 按鈕。</div>
<div class="statusSteps"></div>
<button class="secondary addStep" type="button" style="margin-top:7px">＋ 新增 Status</button>
</div>
<div class="full"><label>NET NAME</label><input class="netNameText" list="netNameOptions" placeholder="選擇常用 NET NAME，或直接輸入新項目"></div>
<div class="full"><label>SUB-BIN</label><input class="subbinText" list="subbinOptions" placeholder="選擇常用 SUB-BIN，或直接輸入新項目"></div>
<div class="full rcSection" style="display:none"><label>RC 清號代碼</label>
<select class="rcCode">
<option value="">不選擇 RC</option>
<option value="RC35">RC35 — 未做過任何拆解／NTF</option>
<option value="RC56">RC56 — 沒有換料，僅重新組裝 Cable 或板子</option>
<option value="RC48">RC48 — 需更換料件（Cable／板子）</option>
</select>
<div class="rcPartFields">
<label>更換零件 / Part</label>
<select class="rcPart">
<option value="">選擇零件</option>
<option value="Cable / Harness">Cable / Harness</option>
<option value="MGMT Board">MGMT Board</option>
<option value="SWB">SWB</option>
<option value="PDB">PDB</option>
<option value="OSFP Board">OSFP Board</option>
<option value="BMC">BMC</option>
<option value="SSD">SSD</option>
<option value="Leakage Sensor">Leakage Sensor</option>
<option value="J48 Sensor">J48 Sensor</option>
<option value="Other">Other / 自填</option>
</select>
<input class="rcPartCustom" placeholder="自填零件名稱（可搭配上方選單）">
</div>
</div>
</div>
</section>
</div>
<script>
var records=document.getElementById('records');
var templateHTML=document.getElementById('recordTemplate').innerHTML;
var statusGroups=[
 {name:'檢查／測試',items:[
 {label:'Check',result:'check_test'},
 {label:'Test resistance',result:'resistance_test'}
 ]},
 {name:'維修／處理',items:[
 {label:'Reburn JTAG',result:true},{label:'Retest DFT',result:true},{label:'ICT',result:true},
 {label:'Reassemble',result:'reassemble_part'},
 {label:'Replace',result:'replace_part'},{label:'Need RE to change',result:'handoff_part'},{label:'Need RE to rework',result:'handoff_part'},
 {label:'Need RE do ICT',result:'ict_handoff'},
 {label:'Need RE to assemble',result:'assemble_handoff'}
 ]},
 {name:'其他',items:[
 {label:'NTF',result:null},{label:'Need further debug',result:null},{label:'Check out',result:null},{label:'自訂輸入',result:'custom'}
 ]}
];
function updateRCVisibility(card){
 var found=false;
 card.querySelectorAll('.stepRow').forEach(function(row){
 var sel=row.querySelector('.stepSelect');
 if(!sel||!sel.value||sel.value==='custom')return;
 var ids=sel.value.split('_'),item=statusGroups[Number(ids[0])]&&statusGroups[Number(ids[0])].items[Number(ids[1])];
 if(item&&item.label==='Check out')found=true;
 });
 var section=card.querySelector('.rcSection');
 section.style.display=found?'block':'none';
 if(!found){
 card.querySelector('.rcCode').value='';
 card.querySelector('.rcPart').value='';
 card.querySelector('.rcPartCustom').value='';
 card.querySelector('.rcPartFields').classList.remove('show');
 }
}
function addStep(card, presetValue){
 var row=document.createElement('div');row.className='stepRow';
 var no=document.createElement('span');no.className='stepNo';
 var moveControls=document.createElement('div');moveControls.className='moveControls';
 var moveUp=document.createElement('button');moveUp.type='button';moveUp.className='moveStep';moveUp.textContent='↑';moveUp.title='上移一步';moveUp.setAttribute('aria-label','上移一步');
 var moveDown=document.createElement('button');moveDown.type='button';moveDown.className='moveStep';moveDown.textContent='↓';moveDown.title='下移一步';moveDown.setAttribute('aria-label','下移一步');
 moveUp.onclick=function(){if(row.previousElementSibling){row.parentNode.insertBefore(row,row.previousElementSibling);renumberSteps(card);flashMoved(row);}};
 moveDown.onclick=function(){if(row.nextElementSibling){row.parentNode.insertBefore(row,row.nextElementSibling.nextElementSibling);renumberSteps(card);flashMoved(row);}};
 moveControls.appendChild(moveUp);moveControls.appendChild(moveDown);
 var action=document.createElement('select');action.className='stepSelect';
 var first=document.createElement('option');first.value='';first.textContent='選擇 Status';action.appendChild(first);
 var customOption=document.createElement('option');customOption.value='custom';customOption.textContent='自訂輸入 …';action.appendChild(customOption);
 for(var i=0;i<statusGroups.length;i++){
 var og=document.createElement('optgroup');og.label=statusGroups[i].name;
 for(var k=0;k<statusGroups[i].items.length;k++){
 var op=document.createElement('option');op.value=i+'_'+k;var optItem=statusGroups[i].items[k];op.textContent=optItem.label+(['replace_part','handoff_part','resistance_test','check_test','ict_handoff','reassemble_part','assemble_handoff'].indexOf(optItem.result)>=0?' …':'');og.appendChild(op);
 }
 action.appendChild(og);
 }
 var result=document.createElement('button');result.type='button';result.className='resultToggle';result.textContent='Pass';result.style.display='none';result.dataset.state='pass';
 var custom=document.createElement('input');custom.className='stepCustom';custom.placeholder='輸入 Status 內容…';custom.style.display='none';
 var reTarget=document.createElement('select');reTarget.className='reTarget';reTarget.style.display='none';
 var reTargetFirst=document.createElement('option');reTargetFirst.value='';reTargetFirst.textContent='選擇零件';reTarget.appendChild(reTargetFirst);
 var reTargets=['AMD','BMC','SWB','OSFP board','MGMT board','PDB','Cable','3 harness','I/O board','Other'];
 for(var rt=0;rt<reTargets.length;rt++){var ro=document.createElement('option');ro.value=reTargets[rt];ro.textContent=reTargets[rt];reTarget.appendChild(ro);}
 var cableInput=document.createElement('input');cableInput.className='cableCustom';cableInput.placeholder='Cable 編號（可留空）…';cableInput.style.display='none';
 var partCustom=document.createElement('input');partCustom.className='partCustom';partCustom.placeholder='輸入零件名稱…';partCustom.style.display='none';
 var partDetail=document.createElement('input');partDetail.className='partDetail';partDetail.placeholder='補充位置／編號（可留空）…';partDetail.style.display='none';
 var replaceResult=document.createElement('button');replaceResult.type='button';replaceResult.className='resultToggle replaceResult';replaceResult.textContent='Pass';replaceResult.dataset.state='pass';replaceResult.style.display='none';
 var resistanceName=document.createElement('input');resistanceName.className='resistanceName';resistanceName.placeholder='測試項目，例如 J16…';resistanceName.style.display='none';resistanceName.style.flex='1 1 150px';resistanceName.style.width='auto';
 var resistanceResult=document.createElement('select');resistanceResult.className='resistanceToggle resistanceResult';resistanceResult.style.display='none';resistanceResult.style.flex='0 0 82px';
 var resistanceOhms=document.createElement('input');resistanceOhms.className='resistanceOhms';resistanceOhms.type='text';resistanceOhms.inputMode='decimal';resistanceOhms.placeholder='阻值（Ω），例如 18';resistanceOhms.style.display='none';
 ['OK','Fail','Open'].forEach(function(v){var o=document.createElement('option');o.value=v.toLowerCase();o.textContent=v;resistanceResult.appendChild(o);});

 function setTarget(target){
 var rt=row.querySelector('.reTarget'), found=Array.from(rt.options).find(function(o){return o.value.toLowerCase()===target.toLowerCase();});
 if(found){rt.value=found.value;rt.dispatchEvent(new Event('change',{bubbles:true}));return true;}
 rt.value='Other';rt.dispatchEvent(new Event('change',{bubbles:true}));row.querySelector('.partCustom').value=target;return false;
 }
 var m;
 // Common pass/fail test actions.
 if((m=st.match(/^Check\s+(.+?)\s+(OK|Fail|Missing)(?:\s+.*)?$/i))){
 choose('Check');row.querySelector('.checkName').value=m[1].trim();row.querySelector('.checkResult').value=m[2].toLowerCase();matched=true;
 }else if((m=st.match(/^Test\s+(.+?)\s+resistance\s+(OK|Fail|Open)(?:\s*\((.*?)\s*Ω?\))?$/i))){
 choose('Test resistance');row.querySelector('.resistanceName').value=m[1].trim();row.querySelector('.resistanceResult').value=m[2].toLowerCase();if(m[2].toLowerCase()==='fail'&&m[3]){row.querySelector('.resistanceOhms').style.display='block';row.querySelector('.resistanceOhms').value=m[3].replace(/\s*Ω$/,'').trim();}matched=true;
 }else if((m=st.match(/^Need RE to assemble\s+(.+)$/i))){choose('Need RE to assemble');setTarget(m[1].trim());matched=true;
 }else if((m=st.match(/^Need RE to (change|rework)\s+(.+)$/i))){choose(m[1].toLowerCase()==='change'?'Need RE to change':'Need RE to rework');setTarget(m[2].trim());matched=true;
 }else if((m=st.match(/^Reassemble\s+(?:cable\s*)?(.+?)(?:\s+-\s*(?:pass|still failed))?$/i))){
 choose('Reassemble');var part=m[1].trim();if(/^cable/i.test(st)){setTarget('Cable');row.querySelector('.cableCustom').value=part.replace(/^cable\s*/i,'');row.querySelector('.cableCustom').style.display='block';}else setTarget(part);matched=true;
 }else if((m=st.match(/^Replace\s+(.+?)(?:\s+-\s*(Pass|Still Failed))?$/i))){
 choose('Replace');setTarget(m[1].trim());if(m[2]){var rb=row.querySelector('.replaceResult');rb.dataset.state=m[2].toLowerCase()==='pass'?'pass':'fail';rb.textContent=m[2];}matched=true;
 }else if((m=st.match(/^(Reburn JTAG|Retest DFT|ICT)\s+(?:still\s+)?(?:power on\s+)?(pass(?:ed)?|fail(?:ed)?)$/i))){choose(m[1]);var tog=row.querySelector('.resultToggle');var isPass=/^pass/i.test(m[2]);tog.dataset.state=isPass?'pass':'fail';tog.textContent=isPass?'Pass':'Fail';matched=true;
 }else if((m=st.match(/^Reassembly\s+(.+?)\s+(?:still\s+)?fail(?:ed)?$/i))){choose('Reassemble');setTarget(m[1].trim());matched=true;
 }else if(/^(NTF|Need further debug|Check out)$/i.test(st)){choose(st);matched=true;
 }else if((m=st.match(/^Need RE do\s+(.+?)\s+ICT(?:\s+or need further debug)?$/i))){choose('Need RE do ICT');row.querySelector('.ictTarget').value=m[1].trim();if(/or need further debug/i.test(st)){var fd=row.querySelector('.furtherDebug');fd.dataset.state='on';fd.textContent='Further debug: ON';}matched=true;
 }
 if(!matched){sel.value='custom';sel.dispatchEvent(new Event('change',{bubbles:true}));row.querySelector('.stepCustom').value=st;}
 });
 });
 renumber();
 document.getElementById('count').textContent=chunks.length+' 筆已回填';
};

addRecord();

</script>
</body></html>
